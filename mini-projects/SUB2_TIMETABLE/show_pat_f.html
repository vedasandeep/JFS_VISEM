<!DOCTYPE html>
<html>
<head>
    <title>Faculty-wise Timetable</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <style>
        table {
            width: 80%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: center;
        }
        th {
            background: lightblue;
        }
        .faculty-title {
            font-weight: bold;
            font-size: 20px;
            margin-top: 30px;
        }
        .su2{
            color:rgb(179, 109, 31);
        }
    </style>
</head>
<body>

<h2>Upload CSV File</h2>
<input type="file" id="csvFile" accept=".csv">
<br>
<input type="text" name="faculty" id="faculty">
<button id = "go">Go</button>
<div id="tables"></div>

<script>



document.getElementById('go').addEventListener('click', function(){
    let csv = document.getElementById("csvFile")
    Papa.parse(csv.files[0], {
        header: true,
        skipEmptyLines: true,
        complete: function (result) {
            processCSV(result.data);
        }
    });
});

function processCSV(data) {
    const timetable = {};

    data.forEach(row => {
        const faculty = row["FACULTY"];
        const day = row["DAY"];
        const session = row["SESSION"]; // FN / AN
        const course = row["COURSE"];
        const room = row["ROOM"];
        const batch = row["BATCH"];
        const name = row["NAME"];

        faculty[faculty] = name;

        if (!faculty || !day || !session) return;

        if (!timetable[faculty]) {
            timetable[faculty] = {};
        }
        if (!timetable[faculty][day]) {
            timetable[faculty][day] = { FN: "", AN: "" };
        }

        if(batch.includes("SU-B2") ){
            timetable[faculty][day][session] =
            `<span style="color:orange"> ${course}<br>Batch: ${batch}<br>Room: ${room}</span>`;
        }
        else{
        timetable[faculty][day][session] =
            `${course}<br>Batch: ${batch}<br>Room: ${room}`;
            }
    });
    console.log(timetable)
    buildTables(timetable);
}

function buildTables(timetable) {
    const container = document.getElementById("tables");
    container.innerHTML = "";

    const days = ["MON", "TUE", "WED", "THU", "FRI", "SAT"];
    let check = true;
    for (const faculty in timetable) {
        if(document.getElementById("faculty").value === ""){
            check = false;
        }
        if(faculty !== document.getElementById("faculty").value && check == true){
            continue;
        }
        const wrapper = document.createElement("div");
        wrapper.style.marginBottom = "40px";

        const title = document.createElement("div");
        title.className = "faculty-title";
        title.innerHTML = `Faculty: ${faculty}`;
        /*
        const btn = document.createElement("button");
        btn.innerHTML = "Print This Timetable";
        btn.style.marginBottom = "10px";
        btn.onclick = function () {
            printTable(faculty);
        };
        */
        const table = document.createElement("table");
        table.id = `table_${faculty.replace(/\s+/g, "_")}`;

        let html = `
            <tr>
                <th>DAY</th>
                <th>FN</th>
                <th rowspan="7">L<br>U<br>N<br>C<br>H</th>
                <th>AN</th>
            </tr>
        `;

        days.forEach(day => {
            const fn = timetable[faculty][day]?.FN || "";
            const an = timetable[faculty][day]?.AN || "";
            
            html += `
                <tr>
                    <td>${day}</td>
                    <td>${fn}</td>
                    <td>${an}</td>
                </tr>
            `;
        });

        table.innerHTML = html;

        wrapper.appendChild(title);
        //wrapper.appendChild(btn);
        wrapper.appendChild(table);
        container.appendChild(wrapper);
    }
    

}

</script>

</body>
</html>
